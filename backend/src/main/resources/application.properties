server.port=8081
spring.application.name=HolidayTripAPI

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/holidaytripdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Gemini API Configuration (OpenAI Compatible)
# Lütfen buraya kendi Gemini API anahtarınızı (Google AI Studio'dan alıp) yapıştırın:
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
gemini.api.model=gemini-3.5-flash-lite

#SerpApi (Google Flights) API anahtarı (uçuş bilgileri için)
serpapi.api.key=${SERPAPI_API_KEY:YOUR_SERPAPI_API_KEY}

# Mail Configuration (SMTP - Gmail veya Özel Sunucu)
# Gerçek e-posta gönderimi için Gmail kullanıcı adı ve 16 haneli Uygulama Şifresi girilebilir.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:YOUR_EMAIL@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:YOUR_16_CHAR_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000